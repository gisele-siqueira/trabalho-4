
services:
  api:
    image: linkextractor-api:step6-ruby
    build: ./api
    ports:
      - "4567:4567"
    environment:
      - REDIS_URL=redis://redis:6379
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
    volumes:
      - ./logs:/app/logs

  web:
    image: linkextractor-web:step6-php
    build: ./www
    ports:
      - "8082:80"
    environment:
      - API_ENDPOINT=http://api:4567/api/

  redis:
    image: redis


